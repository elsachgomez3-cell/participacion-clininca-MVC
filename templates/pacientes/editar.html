{% extends 'base.html' %}

{% block title %}
Editar Paciente
{% endblock %}

{% block page_title %}
Editar Paciente
{% endblock %}

{% block content %}

<div class="card">

    <div class="card-body">

        <h3 class="fw-bold mb-4">

            Editar Paciente

        </h3>

        <form
            method="POST"
            action="/pacientes/update/{{ paciente.id_paciente }}"
        >

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>
                        Nombre
                    </label>

                    <input
                        type="text"
                        name="nombre"
                        class="form-control"
                        value="{{ paciente.nombre }}"
                        required
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label>
                        Edad
                    </label>

                    <input
                        type="number"
                        name="edad"
                        class="form-control"
                        value="{{ paciente.edad }}"
                        required
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label>
                        Dirección
                    </label>

                    <input
                        type="text"
                        name="direccion"
                        class="form-control"
                        value="{{ paciente.direccion }}"
                        required
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label>
                        Teléfono
                    </label>

                    <input
                        type="text"
                        name="telefono"
                        class="form-control"
                        value="{{ paciente.telefono }}"
                        required
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label>
                        Género
                    </label>

                    <select
                        name="genero"
                        class="form-select"
                    >

                        <option
                            {% if paciente.genero == 'Masculino' %}
                            selected
                            {% endif %}
                        >
                            Masculino
                        </option>

                        <option
                            {% if paciente.genero == 'Femenino' %}
                            selected
                            {% endif %}
                        >
                            Femenino
                        </option>

                    </select>

                </div>

                <div class="col-md-6 mb-3">

                    <label>
                        Fecha Registro
                    </label>

                    <input
                        type="date"
                        name="fecha_registro"
                        class="form-control"
                        value="{{ paciente.fecha_registro }}"
                    >

                </div>

            </div>

            <button
                class="btn btn-warning text-white"
            >

                <i class="bi bi-pencil-fill"></i>

                Actualizar

            </button>

            <a
                href="/pacientes"
                class="btn btn-secondary"
            >

                Volver

            </a>

        </form>

    </div>

</div>

{% endblock %}
