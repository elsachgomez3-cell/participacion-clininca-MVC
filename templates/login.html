<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - Clínica MVC</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      body {
        background: linear-gradient(135deg, #0d6efd, #0dcaf0);
        height: 100vh;
        overflow: hidden;
      }

      .login-card {
        border: none;
        border-radius: 25px;
        overflow: hidden;
      }

      .left-panel {
        background: #0d6efd;
        color: white;
        padding: 50px;
      }

      .left-panel img {
        width: 100%;
        border-radius: 20px;
        margin-top: 20px;
      }

      .form-control {
        border-radius: 12px;
        padding: 12px;
      }

      .btn-custom {
        border-radius: 12px;
        padding: 12px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="container h-100">
      <div class="row justify-content-center align-items-center h-100">
        <div class="col-lg-10">
          <div class="card login-card shadow-lg">
            <div class="row g-0">
              <!-- LEFT -->

              <div
                class="col-md-6 left-panel d-flex flex-column justify-content-center"
              >
                <h1 class="fw-bold mb-3">
                  <i class="bi bi-hospital"></i>
                  Clínica MVC
                </h1>

                <p class="lead">
                  Sistema profesional de gestión clínica para administración de
                  médicos, pacientes y consultas.
                </p>

                <img
                  src="https://images.unsplash.com/photo-1584515933487-779824d29309?q=80&w=1200&auto=format&fit=crop"
                />
              </div>

              <!-- RIGHT -->

              <div class="col-md-6 bg-white">
                <div class="p-5">
                  <h2 class="text-center mb-4 fw-bold">Iniciar Sesión</h2>

                  <form method="POST">
                    <div class="mb-3">
                      <label class="form-label"> Usuario </label>

                      <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Ingrese usuario"
                        required
                      />
                    </div>

                    <div class="mb-4">
                      <label class="form-label"> Contraseña </label>

                      <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Ingrese contraseña"
                        required
                      />
                    </div>

                    <button class="btn btn-primary w-100 btn-custom">
                      <i class="bi bi-box-arrow-in-right"></i>
                      Ingresar
                    </button>
                  </form>

                  <hr class="my-4" />
                  <div class="text-center">
                    <p>¿No tienes cuenta?</p>

                    <a
                      href="/register"
                      class="btn btn-success w-100 btn-custom"
                    >
                      <i class="bi bi-person-plus-fill"></i>
                      Crear Cuenta
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
